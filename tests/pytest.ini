[pytest]
addopts = -v -s --tb=native --alluredir=report/allure-results --clean-alluredir
testpaths = testcases
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_* *_test

norecursedirs = __pycache__ .git .venv tests_backup

markers =
    smoke: marks tests as smoke test (smoke)
    login: marks tests related to login module
    slow: marks tests as slow running
    create: marks tests related to create note API
    read: marks tests related to read note API
    update: marks tests related to update note API
    delete: marks tests related to delete note API
    positive: marks positive test cases
    negative: marks negative test cases
    boundary: marks boundary value test cases